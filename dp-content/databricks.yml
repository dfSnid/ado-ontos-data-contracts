# Content data product bundle: the code that builds the objects the
# content-linear contract names. Deployed by pipelines/deploy.yml (dev, then prod behind an
# approval); the contracts repository's publish pipeline then applies the Unity Catalog
# metadata (tags, comments, grants, Certified badge). This bundle never sets any of that.
# Synthetic example data, derived from the content catalogue.
bundle:
  name: content

include:
  - resources/*.yml

# Git-ignored, copied in before each deploy by bin/fetch-rules.sh (dp-integration).
sync:
  include:
    - src/pipeline/contract_expectations.py
    - src/pipeline/contracts/*.odcs.yaml

variables:
  catalog:
    description: Catalog of the contract server for this target
  source_table:
    description: Synthetic source the build derives everything from
    default: content_dev.catalogue.title

workspace:
  host: https://adb-0000000000000000.0.azuredatabricks.net   # your workspace host

targets:
  # A personal copy for trying a change: a prefixed schema in the dev catalog, nothing shared.
  local:
    mode: development
    default: true
    variables:
      catalog: content_dev
  dev:
    variables:
      catalog: content_dev    # contract server dev
  prod:
    variables:
      catalog: content_prod    # contract server prod
