# Content catalogue: Tier 2 (domain) data product contract. Synthetic example data.
# Source of truth for the product. The PR that changes this file is the approval gate:
# at Tier 2 the Content Data Stewards approve it (EAG-01 Tier 2 self-approval).
apiVersion: v3.1.0
kind: DataContract
id: content-catalogue
name: Content catalogue
version: 1.1.0
status: active
domain: content
dataProduct: content-catalogue
tenant: dp-contracts

description:
  purpose: Curated catalogue of titles and episodes with rights windows, for programming and content analytics.
  usage: Reporting and analytics on the content library. Join episode to title on title_id.
  limitations: Synthetic example data. Rights windows are indicative and not for contractual decisions.

team:
  name: Content
  members:
    - username: content.bdo@example.com
      role: Business Data Owner
    - username: content.steward@example.com
      role: Data Steward

servers:
  - server: dev
    type: databricks
    environment: dev
    host: adb-0000000000000000.0.azuredatabricks.net   # your workspace host
    catalog: content_dev
    schema: catalogue

schema:
  - name: title
    physicalName: title
    physicalType: table
    logicalType: object
    businessName: Title
    description: One row per title in the content library.
    properties:
      - name: title_id
        logicalType: string
        physicalType: STRING
        primaryKey: true
        required: true
        unique: true
        description: Stable title identifier.
      - name: title_name
        logicalType: string
        physicalType: STRING
        required: true
        description: Display name of the title.
      - name: genre
        logicalType: string
        physicalType: STRING
        description: Primary genre.
        quality:
          - type: library
            metric: nullValues
            mustBeLessThan: 5
            unit: percent
            dimension: completeness
            severity: warning
            description: Validity over 95 percent (Tier 2 target).
      - name: content_type
        logicalType: string
        physicalType: STRING
        required: true
        description: series, movie or special.
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues: [series, movie, special]
            mustBe: 0
            dimension: conformity
            severity: warning
      - name: age_rating
        logicalType: string
        physicalType: STRING
        description: Classification rating (G, PG, M, 16, 18).
      - name: release_year
        logicalType: integer
        physicalType: INT
        description: Year of first release.
      - name: provider
        logicalType: string
        physicalType: STRING
        description: Production company or distributor.
      - name: rights_start
        logicalType: date
        physicalType: DATE
        description: Start of the licence window.
      - name: rights_end
        logicalType: date
        physicalType: DATE
        description: End of the licence window.
      - name: original_language
        logicalType: string
        physicalType: STRING
        description: Original language of the title (ISO 639-1 code, for example en or mi). Added in 1.1.0.
        quality:
          - type: library
            metric: invalidValues
            arguments:
              validValues: [en, mi, es, ko, fr, ja, zh, hi]
            mustBe: 0
            dimension: conformity
            severity: warning
    quality:
      - type: sql
        name: rights_window_valid
        description: Licence windows end after they start.
        query: SELECT count(*) FROM ${object} WHERE rights_end < rights_start
        mustBe: 0
        dimension: consistency
        severity: warning
  - name: episode
    physicalName: episode
    physicalType: table
    logicalType: object
    businessName: Episode
    description: One row per episode of a series title.
    properties:
      - name: episode_id
        logicalType: string
        physicalType: STRING
        primaryKey: true
        required: true
        unique: true
        description: Stable episode identifier.
      - name: title_id
        logicalType: string
        physicalType: STRING
        required: true
        description: Parent title.
      - name: season
        logicalType: integer
        physicalType: INT
        description: Season number.
      - name: episode_number
        logicalType: integer
        physicalType: INT
        description: Episode number within the season.
      - name: duration_minutes
        logicalType: integer
        physicalType: INT
        description: Running time in minutes.
      - name: first_aired
        logicalType: date
        physicalType: DATE
        description: First broadcast or streaming date.

slaProperties:
  - property: freshness
    value: 24
    unit: h
    description: Data refreshed at least daily (Tier 2 target, advisory).

customProperties:
  - property: governanceTier
    value: 2
  - property: securityClassification
    value: internal
  - property: containsPii
    value: false
  - property: consumptionModes
    value: [reporting, analytics]
  - property: incompleteInformationBehaviour
    value: Return what is known and flag missing genre or rights fields; never infer them.
