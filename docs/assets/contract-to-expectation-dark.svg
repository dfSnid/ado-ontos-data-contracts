<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 434" width="1000" height="434" role="img" aria-labelledby="t d">
<title id="t">Contract quality rules become Lakeflow expectations</title>
<desc id="d">Four contract rules and the expectations they become: required true becomes order_id IS NOT NULL; a nullValues rule becomes IS NOT NULL; an invalidValues rule becomes IS NULL OR IN the valid values; an expectation custom property is applied as written. Severity warning or info keeps and counts the row, error drops it, critical fails the update.</desc>

<rect width="1000" height="100%" rx="12" fill="#0d1117"/>
<text x="16" y="34" fill="#e6edf3" font-size="17" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">Quality rules in the contract become Lakeflow expectations</tspan></text>
<text x="16" y="58" fill="#9198a1" font-size="13" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.22">@rules.apply(...)</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"> reads the merged contract, so the pipeline code holds no rules and a rule changes only through an approved pull request.</tspan></text>
<text x="20" y="80" fill="#9198a1" font-size="12.5" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">In the contract (ODCS)</tspan></text>
<text x="490" y="80" fill="#9198a1" font-size="12.5" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Expectation in the pipeline</tspan></text>
<rect x="16" y="88" width="400" height="48" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="30" y="109" fill="#e6edf3" font-size="14" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.16">required: true</tspan></text>
<text x="30" y="127" fill="#9198a1" font-size="12" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">on column order_id</tspan></text>
<path d="M426 112 h50 m-7 -7 l7 7 l-7 7" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="486" y="88" width="498" height="48" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="500" y="117" fill="#e6edf3" font-size="14" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.16">`order_id` IS NOT NULL</tspan></text>
<rect x="16" y="146" width="400" height="48" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="30" y="167" fill="#e6edf3" font-size="14" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.16">nullValues, mustBe: 0</tspan></text>
<text x="30" y="185" fill="#9198a1" font-size="12" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">on column customer_id</tspan></text>
<path d="M426 170 h50 m-7 -7 l7 7 l-7 7" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="486" y="146" width="498" height="48" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="500" y="175" fill="#e6edf3" font-size="14" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.16">`customer_id` IS NOT NULL</tspan></text>
<rect x="16" y="204" width="400" height="48" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="30" y="225" fill="#e6edf3" font-size="14" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.16">invalidValues, validValues: [F, O, P]</tspan></text>
<text x="30" y="243" fill="#9198a1" font-size="12" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">on column order_status</tspan></text>
<path d="M426 228 h50 m-7 -7 l7 7 l-7 7" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="486" y="204" width="498" height="48" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="500" y="233" fill="#e6edf3" font-size="14" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.16">`order_status` IS NULL OR `order_status` IN ('F', 'O', 'P')</tspan></text>
<rect x="16" y="262" width="400" height="48" rx="8" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="30" y="283" fill="#e6edf3" font-size="14" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.16">expectation: total_price &gt; 0</tspan></text>
<text x="30" y="301" fill="#9198a1" font-size="12" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">custom property on any rule</tspan></text>
<path d="M426 286 h50 m-7 -7 l7 7 l-7 7" fill="none" stroke="#3fb950" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="486" y="262" width="498" height="48" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="500" y="291" fill="#e6edf3" font-size="14" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.16">total_price &gt; 0</tspan></text>
<text x="20" y="334" fill="#e6edf3" font-size="13.5" font-weight="600" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">The rule's </tspan><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.69">severity</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5"> sets what the pipeline does with a failing row</tspan></text>
<rect x="16" y="352" width="312" height="40" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
<path d="M36.0 366 L42.0 377 L30.0 377 Z" fill="#d29922"/>
<text x="52" y="377" fill="#e6edf3" font-size="13.5" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.69">warning</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5"> or </tspan><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.69">info</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">: keep the row, count it</tspan></text>
<rect x="344" y="352" width="312" height="40" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
<rect x="359.0" y="367" width="10" height="10" rx="1.5" fill="#f85149"/>
<text x="380" y="377" fill="#e6edf3" font-size="13.5" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.69">error</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">: drop the row</tspan></text>
<rect x="672" y="352" width="312" height="40" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
<rect x="687.0" y="367" width="10" height="10" rx="1.5" fill="#f85149"/>
<text x="708" y="377" fill="#e6edf3" font-size="13.5" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.69">critical</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">: fail the update</tspan></text>
<text x="20" y="414" fill="#9198a1" font-size="12.5" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Whole-table rules (unique, row counts, SQL counts) keep running in </tspan><tspan font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.75">datacontract test</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">. The Lakeflow event log records the pass and fail counts.</tspan></text>
</svg>
